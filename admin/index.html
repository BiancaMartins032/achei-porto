
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administração | Achei Porto</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --azul:#17234B;
  --azul-claro:#4059B8;
  --laranja:#F47A35;
  --amarelo:#FFD84D;
  --fundo:#F5F6F8;
  --texto:#343746;
  --cinza:#737585;
  --borda:#E3E6ED;
  --branco:#FFFFFF;
}
*{box-sizing:border-box}
body{margin:0;background:var(--fundo);color:var(--texto);font-family:Arial,sans-serif}
header{background:var(--azul);color:white;padding:22px 18px}
header h1{margin:0;font-size:23px}
header p{margin:7px 0 0;color:#e5e8f5;font-size:14px}
main{max-width:1050px;margin:25px auto;padding:0 16px 40px}
.card{background:white;border:1px solid var(--borda);border-radius:15px;padding:20px;margin-bottom:18px}
h2{font-size:19px;margin:0 0 18px;color:var(--azul)}
label{display:block;font-size:13px;font-weight:bold;margin:13px 0 6px}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--borda);border-radius:9px;font:inherit;background:white;color:var(--texto)}
textarea{min-height:90px;resize:vertical}
button{border:0;border-radius:9px;padding:12px 16px;font-weight:bold;cursor:pointer;font-size:14px}
.primary{background:var(--azul);color:white}
.secondary{background:#edf0fa;color:var(--azul)}
.danger{background:#fff0ed;color:#a83222}
.orange{background:var(--laranja);color:white}
button:disabled{opacity:.5;cursor:not-allowed}
.actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:16px}
.hidden{display:none!important}
.notice{padding:12px;border-radius:9px;margin:12px 0;font-size:14px;background:#edf0fa}
.notice.error{background:#fff0ed;color:#a83222}
.notice.success{background:#eaf7ed;color:#236b35}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.item{border:1px solid var(--borda);border-radius:12px;padding:15px;margin-top:12px}
.item h3{margin:0 0 7px;color:var(--azul);font-size:16px}
.item p{margin:5px 0;color:var(--cinza);font-size:13px}
.status{font-size:12px;font-weight:bold}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
#logout{background:#fff;color:var(--azul)}
small{color:var(--cinza)}
@media(max-width:650px){.grid{grid-template-columns:1fr}main{margin-top:15px}.card{padding:16px}}
</style>
</head>
<body>
<header>
  <h1>Achei Porto</h1>
  <p>Painel de administração</p>
</header>

<main>
  <section id="loginCard" class="card">
    <h2>Acesso administrativo</h2>
    <p>Entre com sua conta de administrador.</p>
    <form id="loginForm">
      <label for="email">E-mail</label>
      <input id="email" type="email" required autocomplete="username">
      <label for="password">Senha</label>
      <input id="password" type="password" required autocomplete="current-password">
      <div class="actions">
        <button class="primary" type="submit">Entrar</button>
      </div>
    </form>
    <div id="loginNotice" class="notice hidden"></div>
  </section>

  <section id="panel" class="hidden">
    <div class="card topline">
      <div>
        <h2 style="margin:0">Estabelecimentos</h2>
        <small>Gerencie os cadastros da vitrine.</small>
      </div>
      <button id="logout" type="button">Sair</button>
    </div>

    <section class="card">
      <h2 id="formTitle">Cadastrar estabelecimento</h2>
      <form id="businessForm">
        <input type="hidden" id="businessId">

        <label for="nome">Nome do estabelecimento *</label>
        <input id="nome" required maxlength="150">

        <div class="grid">
          <div>
            <label for="tipo">Tipo</label>
            <select id="tipo">
              <option value="Empresa">Empresa</option>
              <option value="Profissional">Profissional</option>
              <option value="Produto">Produto</option>
              <option value="Serviço">Serviço</option>
            </select>
          </div>
          <div>
            <label for="categoria">Categoria *</label>
            <select id="categoria" required>
              <option value="">Selecione</option>
              <option>Alimentação</option>
              <option>Moda</option>
              <option>Beleza</option>
              <option>Automotivo</option>
              <option>Serviços</option>
              <option>Saúde</option>
              <option>Educação</option>
              <option>Construção</option>
              <option>Casa e decoração</option>
              <option>Esportes</option>
              <option>Outros</option>
            </select>
          </div>
        </div>

        <label for="descricao">Descrição</label>
        <textarea id="descricao" maxlength="1000" placeholder="Conte um pouco sobre o negócio..."></textarea>

        <div class="grid">
          <div>
            <label for="bairro">Bairro</label>
            <input id="bairro">
          </div>
          <div>
            <label for="endereco">Endereço</label>
            <input id="endereco">
          </div>
        </div>

        <div class="grid">
          <div>
            <label for="telefone">Telefone</label>
            <input id="telefone" placeholder="(63) 00000-0000">
          </div>
          <div>
            <label for="whatsapp">WhatsApp</label>
            <input id="whatsapp" placeholder="5563999999999">
          </div>
        </div>

        <label for="horario">Horário de funcionamento</label>
        <input id="horario" placeholder="Ex.: Segunda a sábado, das 8h às 18h">

        <label for="whatsapp">WhatsApp</label>
        <input id="whatsapp" type="tel" placeholder="(63) 99999-9999">
        
        <label for="instagram">Instagram</label>
        <input id="instagram" type="url" placeholder="https://www.instagram.com/nomedonegocio">

       


        <label for="imagem">Foto do estabelecimento</label>
        <input id="imagem" type="file" accept="image/jpeg,image/png,image/webp">
        <small>Formatos JPG, PNG ou WebP. Prefira imagens de até 5 MB.</small>

        <label for="imagemUrl">Ou endereço de uma imagem já hospedada</label>
        <input id="imagemUrl" type="url" placeholder="https://...">

        <label style="display:flex;align-items:center;gap:9px">
          <input id="ativo" type="checkbox" checked style="width:auto">
          Exibir na vitrine pública
        </label>

        <div class="actions">
          <button class="primary" id="saveButton" type="submit">Salvar estabelecimento</button>
          <button class="secondary hidden" id="cancelEdit" type="button">Cancelar edição</button>
        </div>
      </form>
      <div id="formNotice" class="notice hidden"></div>
    </section>

    <section class="card">
      <div class="topline">
        <h2 style="margin:0">Cadastros existentes</h2>
        <button class="secondary" id="refresh" type="button">Atualizar lista</button>
      </div>
      <div id="listNotice" class="notice hidden"></div>
      <div id="businessList"></div>
    </section>
  </section>
</main>

<script>
const SUPABASE_URL = "https://buzxjigzylucpkkddfaa.supabase.co";
const SUPABASE_KEY = "sb_publishable_0yi9qA0pbTJvMMOKd5fGEg_d8R_1wOL";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);

function showNotice(id, message, error=false) {
  const el = $(id);
  el.textContent = message;
  el.className = "notice" + (error ? " error" : " success");
}

function hideNotice(id) {
  $(id).classList.add("hidden");
}

function escapeHTML(value) {
  return String(value ?? "").replace(/[&<>"']/g, char => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"
  })[char]);
}

async function verifyAdmin() {
  const {data:{session}} = await client.auth.getSession();
  if (!session) {
    $("loginCard").classList.remove("hidden");
    $("panel").classList.add("hidden");
    return;
  }

  const {data, error} = await client.rpc("is_admin");
  if (error || data !== true) {
    await client.auth.signOut();
    $("loginCard").classList.remove("hidden");
    $("panel").classList.add("hidden");
    showNotice("loginNotice", "Esta conta não possui permissão de administrador.", true);
    return;
  }

  $("loginCard").classList.add("hidden");
  $("panel").classList.remove("hidden");
  await loadBusinesses();
}

$("loginForm").addEventListener("submit", async event => {
  event.preventDefault();
  hideNotice("loginNotice");

  const {error} = await client.auth.signInWithPassword({
    email:$("email").value.trim(),
    password:$("password").value
  });

  if (error) {
    showNotice("loginNotice", "Não foi possível entrar. Confira seu e-mail e sua senha.", true);
    return;
  }

  await verifyAdmin();
});

$("logout").addEventListener("click", async () => {
  await client.auth.signOut();
  $("panel").classList.add("hidden");
  $("loginCard").classList.remove("hidden");
  resetForm();
});

client.auth.onAuthStateChange(() => {
  setTimeout(verifyAdmin, 0);
});

async function loadBusinesses() {
  $("businessList").innerHTML = "<p>Carregando cadastros...</p>";
  const {data, error} = await client
    .from("estabelecimentos")
    .select("*")
    .order("created_at", {ascending:false});

  if (error) {
    $("businessList").innerHTML = "";
    showNotice("listNotice", "Erro ao carregar os cadastros: " + error.message, true);
    return;
  }

  hideNotice("listNotice");

  if (!data.length) {
    $("businessList").innerHTML = "<p>Nenhum estabelecimento cadastrado ainda.</p>";
    return;
  }

  $("businessList").innerHTML = data.map(item => `
    <article class="item">
      <h3>${escapeHTML(item.nome)}</h3>
      <p>${escapeHTML(item.categoria || "Sem categoria")} · ${escapeHTML(item.bairro || "Bairro não informado")}</p>
      <p class="status" style="color:${item.ativo ? "#236b35" : "#a83222"}">
        ${item.ativo ? "● Ativo na vitrine" : "● Desativado"}
      </p>
      <div class="actions">
        <button class="secondary" type="button" data-edit="${item.id}">Editar</button>
        <button class="secondary" type="button" data-toggle="${item.id}" data-active="${item.ativo}">
          ${item.ativo ? "Desativar" : "Ativar"}
        </button>
        <button class="danger" type="button" data-delete="${item.id}">Excluir</button>
      </div>
    </article>
  `).join("");

  $("businessList").querySelectorAll("[data-edit]").forEach(button => {
    button.addEventListener("click", () => editBusiness(data.find(x => x.id == button.dataset.edit)));
  });

  $("businessList").querySelectorAll("[data-toggle]").forEach(button => {
    button.addEventListener("click", () => toggleBusiness(
      button.dataset.toggle,
      button.dataset.active === "true"
    ));
  });

  $("businessList").querySelectorAll("[data-delete]").forEach(button => {
    button.addEventListener("click", () => deleteBusiness(button.dataset.delete));
  });
}

function editBusiness(item) {
  $("businessId").value = item.id;
  $("nome").value = item.nome || "";
  $("tipo").value = item.tipo || "Empresa";
  $("categoria").value = item.categoria || "";
  $("descricao").value = item.descricao || "";
  $("bairro").value = item.bairro || "";
  $("endereco").value = item.endereco || "";
  $("telefone").value = item.telefone || "";
  $("whatsapp").value = item.whatsapp || "";
  $("instagram").value = item.instagram_url || "";
  $("horario").value = item.horario_funcionamento || "";
  $("imagemUrl").value = item.imagem_url || "";
  $("ativo").checked = item.ativo === true;
  $("imagem").value = "";
  $("formTitle").textContent = "Editar estabelecimento";
  $("saveButton").textContent = "Salvar alterações";
  $("cancelEdit").classList.remove("hidden");
  hideNotice("formNotice");
  $("businessForm").scrollIntoView({behavior:"smooth"});
}

function resetForm() {
  $("businessForm").reset();
  $("businessId").value = "";
  $("ativo").checked = true;
  $("imagem").value = "";
  $("formTitle").textContent = "Cadastrar estabelecimento";
  $("saveButton").textContent = "Salvar estabelecimento";
  $("cancelEdit").classList.add("hidden");
  hideNotice("formNotice");
}

$("cancelEdit").addEventListener("click", resetForm);

$("businessForm").addEventListener("submit", async event => {
  event.preventDefault();
  $("saveButton").disabled = true;
  hideNotice("formNotice");

  try {
    let imageUrl = $("imagemUrl").value.trim();
    const file = $("imagem").files[0];

    if (file) {
      if (file.size > 5 * 1024 * 1024) {
        throw new Error("A imagem deve ter no máximo 5 MB.");
      }

      const safeName = file.name.normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[^a-zA-Z0-9._-]/g, "-");

      const path = Date.now() + "-" + safeName;
      const {error:uploadError} = await client.storage
        .from("imagens-estabelecimentos")
        .upload(path, file, {upsert:false});

      if (uploadError) throw uploadError;

      const {data:urlData} = client.storage
        .from("imagens-estabelecimentos")
        .getPublicUrl(path);

      imageUrl = urlData.publicUrl;
    }

    const record = {
      nome:$("nome").value.trim(),
      tipo:$("tipo").value,
      categoria:$("categoria").value,
      descricao:$("descricao").value.trim(),
      bairro:$("bairro").value.trim(),
      endereco:$("endereco").value.trim(),
      telefone:$("telefone").value.trim(),
      whatsapp:$("whatsapp").value.trim(),
      horario_funcionamento:$("horario").value.trim(),
      instagram_url:$("instagram").value.trim(),
      imagem_url:imageUrl,
      ativo:$("ativo").checked
    };

    const id = $("businessId").value;
    let result;

    if (id) {
      result = await client.from("estabelecimentos").update(record).eq("id", id);
    } else {
      result = await client.from("estabelecimentos").insert(record);
    }

    if (result.error) throw result.error;

    showNotice("formNotice", "Estabelecimento salvo com sucesso!");
    resetForm();
    await loadBusinesses();

  } catch (error) {
    showNotice("formNotice", "Não foi possível salvar: " + error.message, true);
  } finally {
    $("saveButton").disabled = false;
  }
});

async function toggleBusiness(id, currentlyActive) {
  const {error} = await client.from("estabelecimentos")
    .update({ativo:!currentlyActive}).eq("id", id);

  if (error) {
    showNotice("listNotice", "Erro ao alterar situação: " + error.message, true);
    return;
  }
  await loadBusinesses();
}

async function deleteBusiness(id) {
  if (!confirm("Tem certeza de que deseja excluir este estabelecimento?")) return;

  const {error} = await client.from("estabelecimentos").delete().eq("id", id);

  if (error) {
    showNotice("listNotice", "Erro ao excluir: " + error.message, true);
    return;
  }

  showNotice("listNotice", "Cadastro excluído. A foto enviada anteriormente permanece no armazenamento.");
  await loadBusinesses();
}

$("refresh").addEventListener("click", loadBusinesses);

verifyAdmin();
</script>
</body>
</html>
